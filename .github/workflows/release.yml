name: release

# Build prebuilt binaries for each supported platform and attach them to the
# GitHub Release for a pushed version tag (e.g. `0.1.1`, no `v`).
# herdr/install.sh downloads the matching asset on `herdr plugin install`.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  # A tag push creates no Release on its own; create it as a draft so it is
  # only published once every binary is attached.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh downloads the release named after the manifest version, so
      # a tag that disagrees with it would publish binaries nobody fetches.
      - name: Tag matches manifest versions
        run: |
          manifest="$(grep -m1 '^version' herdr-plugin.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          cargo="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$GITHUB_REF_NAME" != "$manifest" ] || [ "$GITHUB_REF_NAME" != "$cargo" ]; then
            echo "tag $GITHUB_REF_NAME != herdr-plugin.toml $manifest / Cargo.toml $cargo" >&2
            exit 1
          fi
      - uses: taiki-e/create-gh-release-action@v1
        with:
          title: herdr-pr-modal $version
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      # Builds for the target (via `cross` where needed), archives it as
      # herdr-pr-modal-<target>.tar.gz with a .sha256 sidecar, and uploads both.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: herdr-pr-modal
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish only when every target's assets are attached, so a public release
  # never makes install.sh 404.
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
